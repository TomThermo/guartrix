<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{appName}}</title>
</head>
<body style="margin:0;padding:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef1f4;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #d7dde5;">
          <tr>
            <td style="padding:18px 24px;border-bottom:1px solid #d7dde5;">
              {{#logo}}
              <img src="{{logoUrl}}" alt="{{appName}}" height="32" style="display:block;height:32px;width:auto;border:0;" />
              {{/logo}}
              {{^logo}}
              <div style="font-size:18px;font-weight:700;letter-spacing:-0.01em;color:#111827;">{{appName}}</div>
              {{/logo}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:14px 24px;border-top:1px solid #d7dde5;font-size:12px;line-height:1.5;color:#6b7280;">
              Sent by {{appName}} · <a href="{{panelUrl}}" style="color:#2563eb;text-decoration:none;">{{panelUrl}}</a><br />
              From {{fromAddress}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
