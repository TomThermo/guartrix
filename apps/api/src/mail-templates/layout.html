<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{appName}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1d21;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e9ef;">
          <tr>
            <td style="padding:24px 28px 16px;border-bottom:1px solid #eef1f5;">
              {{#logo}}
              <img src="{{logoUrl}}" alt="{{appName}}" height="36" style="display:block;height:36px;width:auto;border:0;" />
              {{/logo}}
              {{^logo}}
              <div style="font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#0f172a;">{{appName}}</div>
              {{/logo}}
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px;border-top:1px solid #eef1f5;font-size:12px;line-height:1.5;color:#6b7280;">
              Sent by {{appName}} · <a href="{{panelUrl}}" style="color:#2563eb;text-decoration:none;">{{panelUrl}}</a><br />
              From {{fromAddress}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
