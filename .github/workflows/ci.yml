# Enterprise code gates + unit tests
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Enterprise checks
        run: npm run check:enterprise

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: enterprise
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test
